<!-- @dsCard group="Components" viewport="700x260" name="Form controls" subtitle="Field, Input, Select, Textarea with focus + error states" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-base); color: var(--text); font-family: var(--font);
         padding: 22px; background-image: var(--wash-app); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; max-width: 660px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Field, Input, Select, Textarea } = window.POSUKDesignSystem_85bb4f;
  function Demo() {
    return (
      <div className="grid">
        <Field label="Customer name" hint="As it appears on invoices">
          <Input placeholder="Acme Trading Ltd" defaultValue="Acme Trading Ltd" />
        </Field>
        <Field label="Payment mode">
          <Select defaultValue="CASH">
            <option value="CASH">Cash</option>
            <option value="BANK_TRANSFER">Bank transfer</option>
            <option value="CHEQUE">Cheque</option>
          </Select>
        </Field>
        <Field label="VAT number" error="Invalid VAT number">
          <Input defaultValue="GB-000" invalid />
        </Field>
        <Field label="Billing address" style={{ gridColumn: "1 / -1" }}>
          <Textarea rows={2} placeholder="Street, city, postcode" />
        </Field>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
