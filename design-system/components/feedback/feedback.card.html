<head>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Modal, Field, Input, Select, Button } = window.POSUKDesignSystem_85bb4f;
  function Demo() {
    return (
      <Modal
        title="Create customer"
        footer={<><Button>Save</Button><Button variant="ghost">Cancel</Button></>}
      >
        <Field label="Name" style={{ marginBottom: 12 }}><Input defaultValue="Acme Trading Ltd" /></Field>
        <Field label="Customer type" style={{ marginBottom: 4 }}>
          <Select defaultValue="trade">
            <option value="trade">Trade</option>
            <option value="retail">Retail</option>
          </Select>
        </Field>
      </Modal>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
