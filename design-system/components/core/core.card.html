<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-base); color: var(--text); font-family: var(--font);
         padding: 22px; background-image: var(--wash-app); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cap { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: var(--tracking-wider);
         color: var(--text-subtle); font-weight: var(--fw-semibold); width: 70px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, BrandMark } = window.POSUKDesignSystem_85bb4f;
  function Demo() {
    return (
      <div className="stack">
        <div className="row"><span className="cap">Primary</span>
          <Button>New invoice</Button>
          <Button size="sm">Small</Button>
          <Button size="lg">Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row"><span className="cap">Ghost</span>
          <Button variant="ghost">Refresh</Button>
          <Button variant="ghost" size="sm">Filter</Button>
          <Button variant="danger" size="sm">Delete</Button>
          <IconButton label="Remove">✕</IconButton>
          <IconButton label="Info" variant="accent">i</IconButton>
        </div>
        <div className="row"><span className="cap">Brand</span>
          <BrandMark size={36} />
          <BrandMark size={44} showWordmark />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
