<!-- @dsCard group="Type" viewport="700x150" name="Weights" subtitle="400–800 — the five weights in use" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg-base); color: var(--text); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .w { font-size: 1.7rem; letter-spacing: var(--tracking-snug); }
  .l { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
<div class="grid">
  <div><div class="w" style="font-weight:400">Aa</div><div class="l">400 Regular</div></div>
  <div><div class="w" style="font-weight:500">Aa</div><div class="l">500 Medium</div></div>
  <div><div class="w" style="font-weight:600">Aa</div><div class="l">600 Semibold</div></div>
  <div><div class="w" style="font-weight:700">Aa</div><div class="l">700 Bold</div></div>
  <div><div class="w" style="font-weight:800">Aa</div><div class="l">800 Extrabold</div></div>
</div>
</body>
</html>
