<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); }
  .wash { min-height: 180px; background-color: var(--bg-base); background-image: var(--wash-app);
          display: flex; align-items: flex-end; padding: 22px; }
  .tag { color: var(--text-muted); font-size: var(--fs-sm); font-family: var(--font-mono); }
  .tag b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div class="wash">
  <div class="tag">two radial blooms — <b>cyan</b> top-right, <b>blue</b> bottom-left — over <b>#0c1222</b></div>
</div>
</body>
</html>
