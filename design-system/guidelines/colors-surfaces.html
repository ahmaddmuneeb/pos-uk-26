<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & elevation" subtitle="The dark navy canvas and its elevation ladder" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg-base); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-sm); border: 1px solid var(--border); height: 64px; }
  .name { color: var(--text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); margin-top: 8px; }
  .hex { color: var(--text-subtle); font-size: var(--fs-xs); font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div><div class="sw" style="background:var(--bg-base)"></div><div class="name">Base</div><div class="hex">#0c1222</div></div>
  <div><div class="sw" style="background:var(--bg-elevated)"></div><div class="name">Elevated</div><div class="hex">#111827</div></div>
  <div><div class="sw" style="background:var(--bg-surface)"></div><div class="name">Surface</div><div class="hex">#151f32</div></div>
  <div><div class="sw" style="background:var(--bg-card-solid)"></div><div class="name">Card</div><div class="hex">#1a2438</div></div>
  <div><div class="sw" style="background:var(--bg-card)"></div><div class="name">Card (alpha)</div><div class="hex">#fff / 4%</div></div>
</div>
</body>
</html>
