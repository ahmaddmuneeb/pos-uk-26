<!-- @dsCard group="Brand" viewport="700x200" name="Logo mark" subtitle="Cyan→blue rounded square with a cyan glow, on app & login surfaces" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); color: var(--text); padding: 0; }
  .split { display: flex; min-height: 200px; }
  .pane { flex: 1; display: flex; align-items: center; gap: 14px; padding: 24px; }
  .app { background: var(--bg-base); background-image: var(--wash-app); }
  .login { background: var(--bg-base); background-image: var(--wash-login); justify-content: center; }
  .mark { border-radius: 26%; background: var(--primary); display: grid; place-items: center; color: #fff; font-weight: 800; letter-spacing: -0.02em; box-shadow: var(--glow-accent); }
  .m36 { width: 36px; height: 36px; font-size: 15px; }
  .m48 { width: 48px; height: 48px; font-size: 20px; box-shadow: 0 8px 32px rgba(34,211,238,.25); }
  .wm-title { font-size: var(--fs-md); font-weight: 700; letter-spacing: var(--tracking-snug); }
  .wm-sub { font-size: var(--fs-sm); font-weight: 500; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="split">
  <div class="pane app">
    <div class="mark m36">P</div>
    <div><div class="wm-title">POS / ERP</div><div class="wm-sub">Operations</div></div>
  </div>
  <div class="pane login">
    <div style="text-align:center">
      <div class="mark m48" style="margin:0 auto 12px">P</div>
      <div class="wm-title" style="font-size:1.35rem;letter-spacing:var(--tracking-tight)">Welcome back</div>
      <div class="wm-sub">Sign in to continue to POS / ERP</div>
    </div>
  </div>
</div>
</body>
</html>
