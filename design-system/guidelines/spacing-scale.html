<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px rhythm — the tight 5.6px gap is the product's signature" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg-base); color: var(--text); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--primary); border-radius: 3px; width: 26px; }
  .l { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); margin-top: 6px; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px"></div><div class="l">1 · 4</div></div>
  <div class="item"><div class="bar" style="height:5.6px"></div><div class="l">2 · 5.6</div></div>
  <div class="item"><div class="bar" style="height:8px"></div><div class="l">3 · 8</div></div>
  <div class="item"><div class="bar" style="height:10.4px"></div><div class="l">4 · 10</div></div>
  <div class="item"><div class="bar" style="height:12px"></div><div class="l">5 · 12</div></div>
  <div class="item"><div class="bar" style="height:16px"></div><div class="l">6 · 16</div></div>
  <div class="item"><div class="bar" style="height:20px"></div><div class="l">7 · 20</div></div>
  <div class="item"><div class="bar" style="height:24px"></div><div class="l">8 · 24</div></div>
  <div class="item"><div class="bar" style="height:32px"></div><div class="l">9 · 32</div></div>
</div>
</body>
</html>
