<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Plus Jakarta Sans — application-grade scale, 10→22px" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg-card-solid); color: var(--text); padding: 22px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .tok { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-subtle); width: 130px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row"><span class="tok">--fs-xl · 700</span><span style="font-size:var(--fs-xl);font-weight:700;letter-spacing:var(--tracking-snug)">Page title / stat value</span></div>
  <div class="row"><span class="tok">--fs-lg · 700</span><span style="font-size:var(--fs-lg);font-weight:700;letter-spacing:var(--tracking-snug)">Card heading</span></div>
  <div class="row"><span class="tok">--fs-base · 500</span><span style="font-size:var(--fs-base);font-weight:500">Body, nav and input text — 14px</span></div>
  <div class="row"><span class="tok">--fs-sm · 600</span><span style="font-size:var(--fs-sm);font-weight:600;color:var(--text-muted)">Meta &amp; inline fields</span></div>
  <div class="row"><span class="tok">--fs-xs · 600</span><span style="font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--text-subtle)">Table column head</span></div>
  <div class="row"><span class="tok">--fs-2xs · 600</span><span style="font-size:var(--fs-2xs);font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-wider);color:var(--text-subtle)">Nav section overline</span></div>
</body>
</html>
