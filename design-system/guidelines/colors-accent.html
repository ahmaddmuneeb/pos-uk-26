<!-- @dsCard group="Colors" viewport="700x170" name="Accent & brand gradient" subtitle="Cyan accent and the signature cyan→blue gradient" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font); background: var(--bg-base); padding: 20px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .sw { border-radius: var(--radius-sm); border: 1px solid var(--border); height: 84px; flex: 1; display: flex; align-items: flex-end; padding: 10px; }
  .grad { flex: 1.6; border-radius: var(--radius); display: flex; align-items: flex-end; padding: 12px; box-shadow: var(--glow-primary); }
  .name { color: var(--text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
  .hex { color: var(--text-subtle); font-size: var(--fs-xs); font-family: var(--font-mono); margin-top: 2px; }
  .on { color: #fff; }
  .glow { box-shadow: var(--glow-accent); }
</style>
</head>
<body>
<div class="row">
  <div class="grad" style="background:var(--primary)"><div><div class="name on">Brand gradient · --primary</div><div class="hex" style="color:rgba(255,255,255,.8)">#06b6d4 → #3b82f6 · 135°</div></div></div>
  <div class="sw glow" style="background:var(--accent)"><div><div class="name" style="color:#06222a">Accent</div><div class="hex" style="color:#06343f">#22d3ee</div></div></div>
  <div class="sw" style="background:var(--accent-dim)"><div><div class="name on">Accent dim</div><div class="hex" style="color:rgba(255,255,255,.7)">#0891b2</div></div></div>
</div>
</body>
</html>
